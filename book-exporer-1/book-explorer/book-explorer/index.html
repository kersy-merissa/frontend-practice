<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Explorer - Home</title>
    <!-- Tailwind CSS CDN for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- Navigation Bar (Lab 1.1) -->
    <header class="bg-indigo-600 text-white shadow-md">
        <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">📚 Book Explorer</h1>
            <ul class="flex space-x-6">
                <li><a href="index.html" class="hover:underline font-semibold">Home</a></li>
                <li><a href="favorites.html" class="hover:underline">Favorites</a></li>
                <li><a href="about.html" class="hover:underline">About</a></li>
            </ul>
        </nav>
    </header>

    <!-- Hero Section & Search Bar (Lab 1.1 & Lab 3.3) -->
    <main class="container mx-auto px-6 py-8">
        <section class="text-center mb-10">
            <h2 class="text-3xl font-extrabold mb-4">Discover Your Next Great Read</h2>
            <p class="text-gray-600 mb-6">Search through books instantly using the Open Library API.</p>
            
            <!-- Search Container -->
            <div class="flex justify-center gap-2 max-w-md mx-auto">
                <input id="searchInput" type="text" placeholder="Search books by title..." 
                    class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <button id="searchBtn" 
                    class="bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700 transition">
                    Search
                </button>
            </div>
        </section>

        <!-- Loading State Indicator (Lab 3.4) -->
        <div id="loadingSpinner" class="hidden text-center py-10">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-indigo-500 border-t-transparent"></div>
            <p class="text-gray-500 mt-2">Loading books...</p>
        </div>

        <!-- Book Grid Layout (Lab 1.2 & 1.3: Responsive Grid) -->
        <div id="bookGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Dynamic book cards will be injected here via JavaScript -->
        </div>

        <!-- No Results Feedback State (Lab 3.4) -->
        <p id="noResults" class="hidden text-center text-gray-500 py-10">No results found. Try searching for another title.</p>
    </main>

    <!-- Footer Component -->
    <footer class="bg-gray-800 text-white text-center py-4 mt-12">
        <p>&copy; 2026 Book Explorer App. Built with Tailwind & JavaScript.</p>
    </footer>

    <!-- Link main JavaScript module -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
